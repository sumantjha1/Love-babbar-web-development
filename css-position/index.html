<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Positioning</title>
    <style>
        img{
            margin: 10px;
        }
        div{
            border: 1px black;
        }
        .img1{
            position: relative;
            top: 100px;
            right: 100px;
            left: 100px;
            bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">

        <img src="../css-position/cascade-clouds-cool-wallpaper-210186.jpg" alt="poster1" class="img1"
        width="300px" height="300px">
        <img src="../css-position/cascade-clouds-cool-wallpaper-210186.jpg" alt="poster2"
        width="300px" height="300px">

        <img src="../css-position/cascade-clouds-cool-wallpaper-210186.jpg" alt="poster3"
        width="300px" height="300px">
        <img src="../css-position/cascade-clouds-cool-wallpaper-210186.jpg" alt="poster4"
        width="300px" height="300px">
    </div>
</body>
</html>
