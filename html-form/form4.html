<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>complex form</title>
</head>
<body>
<h2>Complex form</h2>
    <form action="">
        <fieldset>
            <legend></legend>
        <label for="name">Name</label>
        <input type="text" name="name" id="name"></input>
    <br><br>
    <label for="emailid">Email</label>
        <input type="email" name="emailid" id="name"></input>
<br><br>

    <label for="phonenumber">Telephone</label>
        <input type="tel" name="phonenumber" id="name"></input>
<br><br>
        <label for="dateOfBirth">Date of birth</label>
<input type="date" name="dateOfBirth" id="dateOfBirth">

<br>
<br>

<label for="gender">Gender</label>
<br><br>
        <label for="radioButton1">Male</label>
        <input type="radio" name="radioButton1" id="">

        <label for="radioButton2">Female</label>
        <input type="radio" name="radioButton2" id="">
<br>
<br>
        <label for="country">Country</label>
<select name="country" id="country">

    <option value="us">united states</option>
</select>

</fieldset>

<fieldset>
<legend>address</legend>

<label for="street">Street</label>
<input type="text" name="street" id="street">
<br><br>
<label for="city">City</label>
<input type="text" name="city" id="city">
<br><br>
<label for="state">State</label>
<input type="text" name="state" id="state">
<br><br>

<label for="zip">Zip</label>
<input type="text" name="zip" id="zip">
<br><br>
</fieldset>

<fieldset>
    <legend>Other Information</legend>

    <label for="textarea1">Comments:</label>
    <br>
    <textarea name="textarea1" id="textarea1" cols="30" rows="10"></textarea>

    
<label for="terms">I agree to the terms of service:</label>
<input type="checkbox" name="terms" id="textarea">
</fieldset>

<input type="button" value="Submit">
    </form>
    
</body>
</html>
